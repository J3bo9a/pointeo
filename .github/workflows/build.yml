name: Build APK
on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Pointeo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pointeo.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Pointeo.apk --title "Pointeo APK" --notes "Debug build"
          git config user.name github-actions; git config user.email actions@github.com
          git checkout --orphan apk; git rm -rf . -q; git add -f Pointeo.apk
          git commit -qm "apk"; git push -f origin apk
        env:
          GH_TOKEN: ${{ github.token }}
