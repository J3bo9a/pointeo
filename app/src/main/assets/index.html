<style>

function makePdf(jpg,w,h,tag){
  const PW=(w>=h?841.89:595.28),PH=(w===1754&&h===1240)?595.28:PW*h/w;
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length};
  push('%PDF-1.4\n');
  if(tag)push('%POINTEO1:'+tag+'\n');
  const obj=(n,body)=>{off[n]=len;push(n+' 0 obj\n'+body+'\nendobj\n')};
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  off[4]=len;push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');push(jpg);push('\nendstream\nendobj\n');
  const cs='q '+PW+' 0 0 '+PH+' 0 0 cm /Im0 Do Q';
  obj(5,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  const xr=len;let x='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}

/* ---------- visionneuse : zoom, déplacement, pincement ---------- */
(()=>{

  function reset(){fit=Math.min(innerWidth/iw,innerHeight/ih);if(innerWidth<innerHeight)fit=innerWidth/iw;sc=fit;tx=ty=0;clamp();apply()}
  function open(){if(!LAST)return;im.onload=()=>{iw=im.naturalWidth||1754;ih=im.naturalHeight||1240;im.style.width=iw+'px';im.style.height=ih+'px';reset()};im.src=LAST.prev;vw.hidden=false;$('#vwh').style.opacity=1;setTimeout(()=>{$('#vwh').style.opacity=0},2600);if(im.complete&&im.naturalWidth)im.onload();$('#vwx').focus()}
  const close=()=>{vw.hidden=true;im.removeAttribute('src');$('#sh-open').focus()};
  $('#sh-open').addEventListener('click',open);$('#vwx').addEventListener('click',close);
  addEventListener('keydown',e=>{if(e.key==='Escape'&&!vw.hidden)close()});
  addEventListener('resize',()=>{if(!vw.hidden)reset()});
  vw.addEventListener('pointerdown',e=>{if(e.target.id==='vwx')return;vw.setPointerCapture&&vw.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){const [a,b]=[...pts.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1]);pm=[(a[0]+b[0])/2,(a[1]+b[1])/2]}
    else if(pts.size===1){const n=Date.now();if(n-lastTap<300){zoomAt(e.clientX,e.clientY,sc>fit*1.3?fit:fit*2.6);lastTap=0}else lastTap=n}});

    else if(pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),m=[(a[0]+b[0])/2,(a[1]+b[1])/2];if(pd>0)zoomAt(m[0],m[1],sc*d/pd);if(pm){tx+=m[0]-pm[0];ty+=m[1]-pm[1];clamp();apply()}pd=d;pm=m}});

  vw.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,sc*(e.deltaY<0?1.18:1/1.18))},{passive:false});
  window._vw={open,close,get sc(){return sc},get fit(){return fit}};
})();

const AP_DAYS={0:'lun lundi mon monday montag lunes segunda lunedi',1:'mar mardi tue tues tuesday dienstag martes terca ter martedi',2:'mer mercredi wed wednesday mittwoch miercoles mie quarta qua mercoledi',3:'jeu jeudi thu thur thurs thursday donnerstag jueves jue quinta qui giovedi gio',4:'ven vendredi fri friday freitag viernes vie sexta sex venerdi',5:'sam samedi sat saturday samstag sabado sab',6:'dim dimanche sun sunday sonntag domingo dom domenica'};

function apLIS(tk){ // plus longue suite d’indices de jours croissants (tk trié dans l’ordre de lecture)

}

    if(run&&run[1]-run[0]<=Math.max(6,W*.005))o.push((run[0]+run[1])/2);return o};
  const hlines=(y0,y1,x0,x1)=>{const o=[];let run=null;y0=Math.max(1,y0|0);y1=Math.min(H-2,y1|0);x0=Math.max(0,x0|0);x1=Math.min(W-1,x1|0);if(x1<=x0)return o;
    for(let y=y0;y<=y1;y++){let n=0;for(let x=x0;x<=x1;x++)if(dk(x,y))n++;if(n/(x1-x0+1)>=.88){if(!run)run=[y,y];else run[1]=y}else if(run){if(run[1]-run[0]<=Math.max(6,H*.005))o.push((run[0]+run[1])/2);run=null}}
    if(run&&run[1]-run[0]<=Math.max(6,H*.005))o.push((run[0]+run[1])/2);return o};
  const out={};
  Object.keys(F).forEach(k=>{
    const f=F[k];let x=f.x*W,y=f.y*H,w=f.w*W,h=f.h*H;const cell=/^[hd][0-6]$|^total$|^sig$/.test(k),cx=x+w/2,cy=y+h/2;
    const vl=vlines(x-W*.12,x+w+(cell?Math.max(W*.04,w):W*.04),y+h*.1,y+h*.9);
    if(cell){const L=vl.filter(v=>v<cx).pop(),R=vl.filter(v=>v>cx)[0];if(L!==undefined&&R!==undefined&&R-L>W*.02&&R-L<=w*1.6+W*.15){x=L+3;w=R-L-6}}
    else{const r=vl.filter(v=>v>x-2);if(r.length>=2&&r[0]-x<=W*.3&&r[1]-r[0]>=W*.04&&r[1]-r[0]<=W*.7){x=r[0]+3;w=r[1]-r[0]-6}else if(r.length>=1&&r[0]>x+W*.04&&r[0]<x+w){w=r[0]-x-3}}
    const hl=hlines(y-h*.8,y+h*1.8,x+w*.3,x+w*.7),T=hl.filter(v=>v<cy).pop(),B=hl.filter(v=>v>cy)[0];
    if(T!==undefined&&B!==undefined&&B-T>=h*.6&&B-T<=h*2.6+H*.05){y=T+3;h=B-T-6}
    out[k]={x:Math.max(0,x/W),y:Math.max(0,y/H),w:Math.min(w,W-x)/W,h:Math.min(h,H-y)/H};
  });
  return out;
}


/* sans en-têtes de jours lisibles : on retrouve les cases de la ligne « Heures » grâce aux traits du formulaire */
function apGrid(F,r,img,W,H){
  if(F.h0||!r.guess)return F;
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0,W,H);
  const D=g.getImageData(0,0,W,H).data,dk=(x,y)=>{const i=(y*W+x)*4;return D[i]*.3+D[i+1]*.59+D[i+2]*.11<125};
  const cellsOf=G=>{const y0=Math.max(0,G.y+G.h*.15|0),y1=Math.min(H-1,G.y+G.h*.85|0),ls=[];let run=null;
    for(let x=Math.max(1,G.x-W*.02|0);x<W-1;x++){let n=0;for(let y=y0;y<=y1;y++)if(dk(x,y))n++;if(n/(y1-y0+1)>=.88){if(!run)run=[x,x];else run[1]=x}else if(run){if(run[1]-run[0]<=Math.max(6,W*.005))ls.push((run[0]+run[1])/2);run=null}}
    if(run&&run[1]-run[0]<=Math.max(6,W*.005))ls.push((run[0]+run[1])/2);const cs=[];for(let i=0;i+1<ls.length;i++)if(ls[i+1]-ls[i]>=W*.03)cs.push([ls[i],ls[i+1]]);return {cs,y:y0,h:y1-y0}};
  const out=Object.assign({},F),put=(k,x0,x1,y,h)=>{out[k]={x:(x0+3)/W,y:(y-h*.1)/H,w:(x1-x0-6)/W,h:h*1.2/H}};
  const hc=cellsOf(r.guess.h);
  if(hc.cs.length>=7){for(let i=0;i<7;i++)put('h'+i,hc.cs[i][0],hc.cs[i][1],hc.y,hc.h);
    const tt=(r.words||[]).find(w=>Math.abs(w.cy-r.guess.h.y)<H*.2);const k=tt?hc.cs.findIndex(c=>tt.cx>=c[0]&&tt.cx<=c[1]):-1;if(k>=7)put('total',hc.cs[k][0],hc.cs[k][1],hc.y,hc.h);
    if(r.guess.d){const dc=cellsOf(r.guess.d);if(dc.cs.length>=7)for(let i=0;i<7;i++)put('d'+i,dc.cs[i][0],dc.cs[i][1],dc.y,dc.h)}}
  return out;
}

/* éditeur */
const ED={T:null,F:{},armed:'name',mode:'draw',sc:1,tx:0,ty:0,fit:1,editing:false};
const wdName=i=>new Date(2024,0,1+i).toLocaleDateString(LOC[LANG],{weekday:'short'}).replace('.','');
function fdLabel(k){if(/^h[0-6]$/.test(k))return wdName(+k[1])+' · '+t('fd.hours');if(/^d[0-6]$/.test(k))return wdName(+k[1])+' · '+t('fd.date');return t('fd.'+k)}
const hasRow=(p)=>[0,1,2,3,4,5,6].every(i=>ED.F[p+i]);
const placed=k=>k==='hrow'?hasRow('h'):k==='drow'?hasRow('d'):!!ED.F[k];
function edChips(){
  $('#edchips').innerHTML=FORDER.map(k=>'<button type="button" data-f="'+k+'" aria-pressed="'+(ED.armed===k)+'" class="'+(placed(k)?'ok':'')+'">'+esc(fdLabel(k))+'</button>').join('');
  const a=document.querySelector('#edchips [aria-pressed=true]');if(a&&a.scrollIntoView)a.scrollIntoView({inline:'center',block:'nearest'});
}
function edBoxes(){
  const ov=$('#edov');
  ov.innerHTML=Object.keys(ED.F).map(k=>{const f=ED.F[k],on=ED.armed===k||(ED.armed==='hrow'&&/^h/.test(k))||(ED.armed==='drow'&&/^d[0-6]$/.test(k));
    return '<div class="fb'+(on?' on':'')+'" style="left:'+f.x*100+'%;top:'+f.y*100+'%;width:'+f.w*100+'%;height:'+f.h*100+'%"><span>'+esc(/^[hd][0-6]$/.test(k)?wdName(+k[1]):fdLabel(k))+'</span></div>'}).join('');
}
function edApply(){
  $('#edst').style.transform='translate('+ED.tx+'px,'+ED.ty+'px) scale('+ED.sc+')';
  const ov=$('#edov');ov.style.setProperty('--bw',(2/ED.sc)+'px');ov.style.setProperty('--is',String(1/ED.sc));
}
function edClamp(){const v=$('#edv').getBoundingClientRect(),w=ED.T.w*ED.sc,h=ED.T.h*ED.sc;
  ED.tx=w<=v.width?(v.width-w)/2:Math.min(0,Math.max(v.width-w,ED.tx));ED.ty=h<=v.height?(v.height-h)/2:Math.min(0,Math.max(v.height-h,ED.ty))}
function edReset(){const v=$('#edv').getBoundingClientRect();ED.fit=Math.min(v.width/ED.T.w,v.height/ED.T.h);ED.sc=ED.fit;ED.tx=ED.ty=0;edClamp();edApply()}
function edZoomAt(x,y,ns){ns=Math.min(ED.fit*10,Math.max(ED.fit*.8,ns));const k=ns/ED.sc;ED.tx=x-(x-ED.tx)*k;ED.ty=y-(y-ED.ty)*k;ED.sc=ns;edClamp();edApply()}
function edOpen(T,fields,editing){
  ED.T=T;ED.F=JSON.parse(JSON.stringify(fields||{}));ED.editing=!!editing;ED.armed=FORDER.find(k=>!placed(k))||'name';ED.mode='draw';
  $('#ednm').value=T.name;$('#edimg').src=T.img;$('#edimg').style.width=T.w+'px';$('#edimg').style.height=T.h+'px';
  $('#edst').style.width=T.w+'px';$('#edst').style.height=T.h+'px';
  $('#edhint').textContent=t('tp.hint');
  document.querySelectorAll('#edmode button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===ED.mode)));
  $('#ed').hidden=false;$('#edauto').hidden=!hasOcr();edChips();edBoxes();requestAnimationFrame(edReset);
}
let edBusy=0;
async function edAuto(){
  const T=ED.T;if(!T||edBusy)return;edBusy=1;$('#edhint').textContent=t('tp.scan');
  try{
    const lines=await ocrImage(T.img);if(ED.T!==T)return;
    const r=autoPlace(lines,T.w,T.h);let FF=r.F;
    try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=T.img});FF=apSnap(apGrid(r.F,r,im,T.w,T.h),im,T.w,T.h)}catch(e){}
    Object.keys(FF).forEach(k=>{ED.F[k]=FF[k]});
    ED.armed=FORDER.find(k=>!placed(k))||'name';edChips();edBoxes();
    $('#edhint').textContent=r.found?t('tp.found',{n:r.found}):t('tp.nofound');
  }catch(e){if(ED.T===T)$('#edhint').textContent=t('tp.noocr')}
  finally{edBusy=0}
}
$('#edauto').addEventListener('click',edAuto);
const edClose=()=>{$('#ed').hidden=true;ED.T=null;$('#edimg').removeAttribute('src')};
$('#edchips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ED.armed=b.dataset.f;ED.mode='draw';document.querySelectorAll('#edmode button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.m==='draw')));edChips();edBoxes()});
$('#edmode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ED.mode=b.dataset.m;document.querySelectorAll('#edmode button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
$('#edrm').addEventListener('click',()=>{const k=ED.armed;if(k==='hrow')[0,1,2,3,4,5,6].forEach(i=>delete ED.F['h'+i]);else if(k==='drow')[0,1,2,3,4,5,6].forEach(i=>delete ED.F['d'+i]);else delete ED.F[k];edChips();edBoxes()});
(()=>{
  const v=$('#edv'),pts=new Map();let drag=null,pd=0,pm=null;
  const toImg=(cx,cy)=>{const r=v.getBoundingClientRect();return [(cx-r.left-ED.tx)/ED.sc,(cy-r.top-ED.ty)/ED.sc]};
  const rectOf=(a,b)=>{const x0=Math.max(0,Math.min(a[0],b[0])),y0=Math.max(0,Math.min(a[1],b[1])),x1=Math.min(ED.T.w,Math.max(a[0],b[0])),y1=Math.min(ED.T.h,Math.max(a[1],b[1]));return {x:x0/ED.T.w,y:y0/ED.T.h,w:(x1-x0)/ED.T.w,h:(y1-y0)/ED.T.h}};
  function setField(k,r){
    if(k==='hrow'||k==='drow'){const p=k==='hrow'?'h':'d';for(let i=0;i<7;i++)ED.F[p+i]={x:r.x+i*r.w/7,y:r.y,w:r.w/7,h:r.h}}
    else ED.F[k]=r;
    const i=FORDER.indexOf(k),nx=FORDER.slice(i+1).concat(FORDER.slice(0,i)).find(x=>!placed(x));if(nx)ED.armed=nx;
    edChips();edBoxes();
  }
  v.addEventListener('pointerdown',e=>{v.setPointerCapture&&v.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){drag=null;const [a,b]=[...pts.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1]);pm=[(a[0]+b[0])/2,(a[1]+b[1])/2];$('#edov').querySelectorAll('.tmp').forEach(n=>n.remove())}
    else if(pts.size===1&&ED.mode==='draw'&&ED.armed){drag={a:toImg(e.clientX,e.clientY),b:null}}});
  v.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const o=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===1){
      if(drag){drag.b=toImg(e.clientX,e.clientY);const r=rectOf(drag.a,drag.b);let n=$('#edov .tmp');if(!n){n=document.createElement('div');n.className='fb on tmp';$('#edov').appendChild(n)}n.style.cssText='left:'+r.x*100+'%;top:'+r.y*100+'%;width:'+r.w*100+'%;height:'+r.h*100+'%'}
      else{ED.tx+=e.clientX-o[0];ED.ty+=e.clientY-o[1];edClamp();edApply()}
    }else if(pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),m=[(a[0]+b[0])/2,(a[1]+b[1])/2],r=v.getBoundingClientRect();if(pd>0)edZoomAt(m[0]-r.left,m[1]-r.top,ED.sc*d/pd);if(pm){ED.tx+=m[0]-pm[0];ED.ty+=m[1]-pm[1];edClamp();edApply()}pd=d;pm=m}});
  const up=e=>{
    if(drag&&drag.b&&pts.size===1){const r=rectOf(drag.a,drag.b);if(r.w*ED.T.w>=12&&r.h*ED.T.h>=8)setField(ED.armed,r);else edBoxes()}
    $('#edov').querySelectorAll('.tmp').forEach(n=>n.remove());drag=null;pts.delete(e.pointerId);pd=0;pm=null};
  v.addEventListener('pointerup',up);v.addEventListener('pointercancel',up);
  v.addEventListener('wheel',e=>{e.preventDefault();const r=v.getBoundingClientRect();edZoomAt(e.clientX-r.left,e.clientY-r.top,ED.sc*(e.deltaY<0?1.18:1/1.18))},{passive:false});
  addEventListener('resize',()=>{if(!$('#ed').hidden)edReset()});
})();
$('#edcancel').addEventListener('click',edClose);
$('#edsave').addEventListener('click',()=>{
  if(!hasRow('h')){$('#edhint').textContent=t('tp.needh');return}
  const T0=ED.T,T={id:T0.id,name:($('#ednm').value.trim()||t('tp.default')).slice(0,40),w:T0.w,h:T0.h,img:T0.img,th:T0.th,fields:JSON.parse(JSON.stringify(ED.F))};
  const old=TPL.slice();if(!installTpl(T)){$('#edhint').textContent=t('tp.bad');return}
  if(!saveTPL()){TPL=old;syncTplAG();$('#edhint').textContent=t('tp.full');return}
  const editing=ED.editing;edClose();renderHome();renderTplList();
  if(!editing){const b=document.querySelector('[data-open="'+T.id+'"]');if(b)b.click()}
  else if(S.agency===T.id)update();
});
$('#tpnew').addEventListener('click',()=>$('#tpfile').click());
$('#tpfile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;const m=$('#opmsg');m.textContent='';
  try{const r=await readImage(f);edOpen({id:'tpl-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:'',w:r.w,h:r.h,img:r.img,th:r.th},{},false);if(hasOcr())edAuto()}catch(x){m.textContent=t('tp.bad')}
});
let tpSure=null;
function renderTplList(){
  const l=$('#tplist');if(!l)return;$('#tpnone').hidden=TPL.length>0;
  l.innerHTML=TPL.map(T=>'<li class="tli"><img alt="" src="'+T.th+'"><b>'+esc(T.name)+'</b><button type="button" class="sm" data-tedit="'+T.id+'">'+esc(t('tp.edit'))+'</button><button type="button" class="sm" data-tdel="'+T.id+'">'+esc(t(tpSure===T.id?'tp.sure':'tp.del'))+'</button></li>').join('');
}
$('#tplist').addEventListener('click',e=>{
  const ed=e.target.closest('[data-tedit]'),dl=e.target.closest('[data-tdel]');
  if(ed){const T=TPL.find(x=>x.id===ed.dataset.tedit);if(T)edOpen(T,T.fields,true);return}
  if(dl){const id=dl.dataset.tdel;
    if(tpSure!==id){tpSure=id;renderTplList();setTimeout(()=>{if(tpSure===id){tpSure=null;renderTplList()}},3500);return}
    tpSure=null;TPL=TPL.filter(x=>x.id!==id);saveTPL();if(S.agency===id){S.agency='';save()}syncTplAG();renderTplList();renderHome()}
});

/* ---------- navigation ---------- */
const V=['accueil','feuille','partage','reglages','historique','modeles'];
const TAB={accueil:'accueil',feuille:'accueil',partage:'partage',reglages:'reglages',historique:'reglages',modeles:'reglages'};
function show(v){
  V.forEach(x=>{$('#v-'+x).hidden=x!==v});
  ['accueil','reglages','partage'].forEach(x=>{const b=$('#t-'+x);if(x===TAB[v])b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  $('#bar').hidden=v!=='feuille';document.body.classList.toggle('s',v==='feuille');
  if(v==='feuille'){const a=agOf(S.agency);$('#agimg').src=url(a);$('#agnm').textContent=a.name;if(ST==='apercu')draw()}
  if(v==='historique')renderHistory();
  if(v==='modeles')renderTplList();
  if(v==='accueil')renderHome();
  window.scrollTo(0,0);
  const h=document.querySelector('#v-'+v+' h1')||(v==='feuille'?$('#agnm'):null);if(h){h.tabIndex=-1;h.focus({preventScroll:true})}
}
function route(){let h=location.hash.slice(1);if(!V.includes(h))h='accueil';if(h==='feuille'&&!agOf(S.agency))h='accueil';show(h)}
function go(v){if(location.hash==='#'+v)route();else location.hash=v}
addEventListener('hashchange',route);

{const o=applyLang;applyLang=function(){o.apply(this,arguments);update()}}
syncLang();fillInputs();syncTheme();setST(S.cli?'semaine':'infos');applyLang();route();if(!hasP())openOb(true);
if(document.documentElement.classList.contains('splash'))setTimeout(()=>document.documentElement.classList.remove('splash'),2000);
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
