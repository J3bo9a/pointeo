<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pointeo</title>
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pointeo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script>(function(){try{var d=document.documentElement,sa=matchMedia('(display-mode: standalone)').matches||navigator.standalone;if((sa||window.SPLASH||/[?&]splash/.test(location.search))&&!matchMedia('(prefers-reduced-motion: reduce)').matches)d.classList.add('splash');setTimeout(function(){d.classList.remove('splash')},3500)}catch(e){}})();</script>
<style>
:root{--bg:#fff;--ink:#000;--mu:#5f5f5f;--ln:#d9d9d9;--in:#fff;--sf:#f4f4f4;--ac:#000;--aci:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#fff;--mu:#a6a6a6;--ln:#2f2f2f;--in:#0b0b0b;--sf:#161616;--ac:#fff;--aci:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--ink:#fff;--mu:#a6a6a6;--ln:#2f2f2f;--in:#0b0b0b;--sf:#161616;--ac:#fff;--aci:#000;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:2rem}
body.s{padding-bottom:7.5rem}
.wrap{max-width:480px;margin:0 auto;padding:1rem 1rem}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.4rem .8rem;margin-bottom:1.6rem}
.brand{display:inline-flex;align-items:center;gap:.55rem;font:inherit;font-weight:700;font-size:1.25rem;background:none;border:0;color:var(--ink);padding:.4rem 0;cursor:pointer}
.ghost{font:inherit;font-size:.9rem;color:var(--ink);background:transparent;border:1px solid var(--ln);border-radius:99px;padding:.4rem .9rem;min-height:2.5rem;cursor:pointer}
.tabs{width:100%;display:flex;border-bottom:1px solid var(--ln)}
.tabs button{font:inherit;background:none;border:0;border-bottom:2px solid transparent;margin:0 1.3rem -1px 0;padding:.55rem .1rem;color:var(--mu);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--ink);border-color:var(--ink);font-weight:700}
h1{font-size:1.5rem;margin:0 0 .3rem}
h2{font-size:.9rem;font-weight:700;color:var(--mu);margin:0 0 .7rem}
.mu{color:var(--mu)}
section{margin:0 0 2.2rem}
label{display:block;font-size:.88rem;color:var(--mu);margin:.8rem 0 .25rem}
input{width:100%;font:inherit;color:var(--ink);background:var(--in);border:1px solid var(--ln);border-radius:10px;padding:.55rem .75rem;min-height:2.75rem}
:is(input,button):focus-visible,.pill:has(input:focus-visible){outline:3px solid var(--ink);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.8rem;margin-top:1rem}
.card{position:relative}
.open{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:.6rem;cursor:pointer}
.open:hover{background:var(--sf)}
.lg{display:flex;align-items:center;justify-content:center;height:72px;padding:6px;background:#fff;border:1px solid var(--ln);border-radius:8px}
.lg img{max-width:100%;max-height:100%}
.nm{display:block;margin-top:.5rem;font-size:.95rem;font-weight:700}
.save{position:absolute;top:-.55rem;right:-.55rem;box-shadow:0 1px 3px rgba(0,0,0,.25);width:2.25rem;height:2.25rem;display:flex;align-items:center;justify-content:center;color:#000;background:#fff;border:1px solid #cfcfcf;border-radius:8px;cursor:pointer}
.save[aria-pressed="true"]{color:#fff;background:#000;border:2px solid #fff}
.cnt{font-size:.88rem;color:var(--mu);margin-top:.7rem}
.acct{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:.7rem .9rem;margin:.4rem 0;cursor:pointer}
.prof{display:flex;flex-direction:column;margin-bottom:1.6rem}
.prof b{font-size:1.3rem}
.grid{display:grid;gap:2.5rem;grid-template-columns:minmax(0,1fr)}
.ag{display:flex;align-items:center;gap:.8rem;margin-bottom:1.6rem}
.ag span.lg{width:110px;height:44px;padding:4px}
.row,.head{display:grid;grid-template-columns:4.4rem 1fr 5rem 2.75rem;gap:.4rem;align-items:center}
.head{font-size:.8rem;color:var(--mu);margin:.9rem 0 .2rem}
.day{margin:.3rem 0}
.d{font-size:.95rem}
.more{font:inherit;font-size:1.2rem;line-height:1;color:var(--mu);background:transparent;border:1px solid var(--ln);border-radius:10px;min-height:2.75rem;cursor:pointer}
.more.on{color:var(--ink);border-color:var(--ink)}
.extra{padding:.1rem 0 .8rem}
.pills{display:flex;margin-top:.8rem}
.pill{position:relative;margin:0;display:inline-flex;align-items:center;font-size:.95rem;color:var(--ink);border:1px solid var(--ln);border-radius:99px;padding:.45rem .95rem;cursor:pointer;background:var(--in)}
.pill:has(input:checked){background:var(--ac);color:var(--aci);border-color:var(--ac)}
.pill input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.tot{display:flex;justify-content:space-between;margin-top:1rem;padding-top:.8rem;border-top:1px solid var(--ln);font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.8rem}
.sm{font:inherit;font-size:.92rem;color:var(--ink);text-decoration:underline;background:transparent;border:0;padding:.5rem .8rem .5rem 0;min-height:2.5rem;cursor:pointer}
.pv{overflow-x:auto;padding-bottom:1rem}
canvas{display:block;width:100%;height:auto;background:#fff;box-shadow:0 0 0 1px var(--ln),0 12px 30px rgba(0,0,0,.18)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--ln);padding:.5rem 1rem calc(.7rem + env(safe-area-inset-bottom,0px));text-align:center}
#msg,#amsg{min-height:1.3rem;font-size:.9rem;color:var(--mu)}
.bt{display:flex;gap:.6rem;justify-content:center}
.b{font:inherit;font-weight:700;font-size:.95rem;min-height:2.9rem;padding:0 .9rem;border-radius:10px;border:1.5px solid var(--ink);cursor:pointer;background:transparent;color:var(--ink)}
.b.p{background:var(--ink);color:var(--bg)}
@property --r{syntax:'<length>';inherits:false;initial-value:0px}
#sp{display:none}
html.splash,html.splash body{overflow:hidden}
html.splash #sp{display:flex;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;background:#0f172a;-webkit-mask-image:radial-gradient(circle at 50% calc(50% - 21px),transparent var(--r),#000 var(--r));mask-image:radial-gradient(circle at 50% calc(50% - 21px),transparent var(--r),#000 var(--r));animation:sphole .85s cubic-bezier(.55,0,.25,1) 1.05s forwards}
.sp-mark{width:104px;height:auto;transform-origin:50% 35.7%;animation:spin .55s cubic-bezier(.2,.7,.2,1) both,spzoom .85s cubic-bezier(.55,0,.25,1) 1.05s forwards}
.sp-dot{transform-box:fill-box;transform-origin:center;animation:sppop .45s cubic-bezier(.3,1.5,.5,1) .4s both}
html.splash .wrap{animation:spsettle .9s cubic-bezier(.2,.7,.2,1) 1.1s both}
@keyframes sphole{from{--r:0px}to{--r:100vmax}}
@keyframes spin{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@keyframes sppop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes spzoom{to{transform:scale(3.4)}}
@keyframes spsettle{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}

.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--ln)}
.list>li{border-bottom:1px solid var(--ln)}
.rb,.it{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:3.4rem;padding:.4rem 0;font:inherit;color:var(--ink);background:none;border:0;text-align:left}
.rb{cursor:pointer}
.it.col{flex-direction:column;align-items:stretch;justify-content:center;gap:.4rem;padding:.9rem 0}
.it.col select{margin-top:.2rem}
.chev{color:var(--mu);font-size:1.5rem;line-height:1}
.small{font-size:.88rem}
.back{padding:0 0 .6rem;min-height:0}
.sw{position:relative;display:inline-block;width:3.1rem;height:1.8rem;margin:0;flex:none}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;min-height:0;cursor:pointer}
.trk{position:absolute;inset:0;border-radius:99px;background:var(--ln);transition:background .2s}
.trk::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--mu);transition:transform .2s,background .2s}
.sw input:checked+.trk{background:var(--ink)}
.sw input:checked+.trk::after{transform:translateX(1.3rem);background:var(--bg)}
.sw input:focus-visible+.trk{outline:3px solid var(--ink);outline-offset:2px}
.shfile{display:flex;gap:1rem;align-items:center;margin:1rem 0 1.4rem}
.shfile img{width:132px;height:auto;border:1px solid var(--ln);border-radius:8px;background:#fff}
.shfile b{word-break:break-all}
.wide{width:100%;margin:.3rem 0}
.apps{display:flex;gap:.5rem;flex-wrap:wrap}
.app{display:inline-flex;align-items:center;min-height:2.9rem;padding:0 1.1rem;border:1.5px solid var(--ink);border-radius:10px;color:var(--ink);text-decoration:none;font-weight:700}
.hi{display:flex;gap:.8rem;align-items:center;padding:.9rem 0;flex-wrap:wrap}
.hi .lg{width:96px;height:44px;flex:none;padding:4px}
.hm{flex:1;min-width:11rem;font-size:.95rem}
.ha{display:flex;gap:.2rem}
.seg{display:flex;flex-wrap:wrap;gap:.5rem}
.seg button{font:inherit;font-size:.95rem;color:var(--ink);background:var(--in);border:1px solid var(--ln);border-radius:99px;padding:.5rem 1.05rem;min-height:2.75rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sglab{display:block;font-size:.88rem;color:var(--mu);margin:.8rem 0 .4rem}

.stabs{display:flex;gap:.4rem;margin:0 0 1.4rem}
.stabs button{flex:1;padding:.5rem .3rem}
.wkn{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:.2rem 0 1rem}
.wkn button{font:inherit;font-size:1.5rem;line-height:1;width:2.9rem;height:2.9rem;flex:none;border:1px solid var(--ln);border-radius:99px;background:var(--in);color:var(--ink);cursor:pointer}
.wkn b{text-align:center;flex:1}
.err{color:#c0262d;font-size:.82rem;margin:.15rem 0 0}
:root[data-theme="dark"] .err{color:#ff8a8a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ff8a8a}}
input[aria-invalid="true"]{border-color:#e5484d}
.prevc{display:block;width:100%;border:0;padding:0;background:none;cursor:zoom-in}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem .5rem;margin:.6rem 0 1rem}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:.45rem;padding:.4rem .2rem;font:inherit;font-size:.82rem;color:var(--ink);background:none;border:0;cursor:pointer;text-align:center;min-height:5.4rem}
.tile .ti{width:3.5rem;height:3.5rem;border-radius:1rem;display:block;overflow:hidden;box-shadow:0 0 0 1px var(--ln)}
.tile .ti svg{display:block;width:100%;height:100%}
.tile .ok{position:absolute;top:.2rem;right:calc(50% - 2.35rem);width:1.35rem;height:1.35rem;border-radius:50%;background:var(--ink);color:var(--bg);font-size:.75rem;font-style:normal;display:none;align-items:center;justify-content:center}
.tile.done .ok{display:flex}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:12px}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--in);border:1px solid var(--ln);border-radius:10px;padding:.6rem .75rem;resize:vertical}
#zoom{position:fixed;inset:0;z-index:900;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
#zoom img{display:block;background:#fff;transform-origin:center center}
#sigv{position:fixed;inset:0;z-index:950;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom));gap:.8rem;overflow:auto}
#sigv h1{margin:0}
#sigw{position:relative;background:#fff;border:2px solid var(--ink);border-radius:14px;height:min(46vh,300px);min-height:180px;flex:none}
#sigw::after{content:'';position:absolute;left:6%;right:6%;bottom:22%;border-bottom:2px dashed #b8b8b8;pointer-events:none}
#sigpad{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#sh-body .row2{display:flex;gap:.6rem}#sh-body .row2 .b{flex:1}
#sigv .row{display:flex;gap:.6rem}#sigv .row .b{flex:1}
#zx{position:absolute;top:calc(env(safe-area-inset-top,0px) + .6rem);right:.8rem;z-index:2;width:3rem;height:3rem;border-radius:50%;border:0;background:#ffffff33;color:#fff;font-size:1.6rem;line-height:1;cursor:pointer}
#print-img{display:none}
@media print{@page{size:A4 landscape;margin:0}body.printing .wrap,body.printing .bar,body.printing #zoom,body.printing #sp{display:none!important}body.printing #print-img{display:block;width:100vw}}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.save{width:2.75rem;height:2.75rem;top:-.7rem;right:-.7rem}
.back{min-height:2.75rem;padding:0 .8rem 0 0}
[tabindex="-1"]:focus{outline:none}
#sp{pointer-events:none}
</style>
</head>
<body>
<div id="sp" aria-hidden="true"><svg class="sp-mark" viewBox="146 102 220 308" width="104"><rect x="152" y="108" width="44" height="296" rx="22" fill="#fff"/><circle cx="256" cy="212" r="82" fill="none" stroke="#fff" stroke-width="44"/><circle class="sp-dot" cx="256" cy="212" r="26" fill="#f59e0b"/></svg></div>
<div class="wrap">
  <header class="top">
    <button class="brand" type="button" data-go="accueil"><svg viewBox="146 102 220 308" height="26" aria-hidden="true"><rect x="152" y="108" width="44" height="296" rx="22" fill="currentColor"/><circle cx="256" cy="212" r="82" fill="none" stroke="currentColor" stroke-width="44"/><circle cx="256" cy="212" r="26" fill="currentColor"/></svg><span>Pointeo</span></button>
    <nav class="tabs">
      <button type="button" data-go="accueil" id="t-accueil" data-i18n="nav.agencies"></button>
      <button type="button" data-go="reglages" id="t-reglages" data-i18n="nav.settings"></button>
      <button type="button" data-go="partage" id="t-partage" data-i18n="nav.share" hidden></button>
    </nav>
  </header>

  <main id="v-accueil">
    <h1 data-i18n="home.title"></h1>
    <p class="mu" style="margin:0 0 1rem" data-i18n="home.sub"></p>
    <input type="search" id="q" data-i18n-ph="home.search" data-i18n-al="home.search" autocomplete="off">
    <div class="seg" id="hf" role="group" style="margin-top:.7rem"><button type="button" data-hf="all" data-i18n="home.all"></button><button type="button" data-hf="saved" data-i18n="home.saved"></button></div>
    <div class="cnt" id="cnt"></div>
    <div class="cards" id="list"></div>
    <p class="mu" id="nores" hidden></p>
  </main>

  <main id="v-feuille" hidden>
    <div class="ag"><span class="lg"><img id="agimg" alt=""></span><div><b id="agnm"></b><br><button class="sm" type="button" data-go="accueil" data-i18n="sheet.change"></button></div></div>
    <div class="seg stabs" id="st" role="tablist">
      <button type="button" role="tab" data-st="infos" aria-selected="true" data-i18n="st.infos"></button>
      <button type="button" role="tab" data-st="semaine" aria-selected="false" data-i18n="sec.week"></button>
      <button type="button" role="tab" data-st="apercu" aria-selected="false" data-i18n="st.prev"></button>
    </div>
    <div id="p-infos">
      <section>
        <h2 data-i18n="sec.worker"></h2>
        <span class="sglab" id="civ-l" style="margin-top:0" data-i18n="f.civ"></span>
        <div class="seg" id="civ" role="group" aria-labelledby="civ-l"><button type="button" data-v="Monsieur" data-i18n="civ.mr"></button><button type="button" data-v="Madame" data-i18n="civ.mrs"></button></div>
        <label for="empno" data-i18n="f.empno"></label><input id="empno" maxlength="20" autocomplete="off">
        <label for="name" data-i18n="f.name"></label><input id="name" maxlength="60" autocomplete="name">
        <label for="addr1" data-i18n="f.addr"></label><input id="addr1" maxlength="60" autocomplete="off">
        <label for="addr2" data-i18n="f.zip"></label><input id="addr2" maxlength="60" autocomplete="off">
        <label for="advisor" data-i18n="f.advisor"></label><input id="advisor" maxlength="60" autocomplete="off">
      </section>
      <section>
        <h2 data-i18n="sec.client"></h2>
        <label for="cli" style="margin-top:0" data-i18n="f.cli"></label><input id="cli" maxlength="60" autocomplete="off">
        <label for="cliA" data-i18n="f.addr"></label><input id="cliA" maxlength="60" autocomplete="off">
        <label for="cliL" data-i18n="f.zip"></label><input id="cliL" maxlength="60" autocomplete="off">
        <label for="contact" data-i18n="f.contact"></label><input id="contact" maxlength="60" autocomplete="off">
        <label for="contract" data-i18n="f.site"></label><input id="contract" maxlength="60" autocomplete="off">
      </section>
    </div>
    <div id="p-semaine" hidden>
      <div class="wkn"><button type="button" data-wk="-1" data-i18n-al="wk.prev">‹</button><b id="wklabel"></b><button type="button" data-wk="1" data-i18n-al="wk.next">›</button></div>
      <div id="days"></div>
      <div class="tot"><span data-i18n="d.total"></span><span id="sum">0h</span></div>
      <div class="acts"><button class="sm" type="button" id="fill" data-i18n="act.copy"></button></div>
      <label for="start" data-i18n="f.start"></label><input type="date" id="start">
    </div>
    <div id="p-apercu" hidden>
      <button type="button" class="prevc" id="prevc" data-i18n-al="prev.hint"><canvas id="sheet" width="1754" height="1240"></canvas></button>
      <p class="mu small" data-i18n="prev.hint"></p>
    </div>
  </main>

  <main id="v-partage" hidden>
    <h1 data-i18n="sh.title"></h1>
    <p class="mu" id="sh-empty" data-i18n="sh.empty"></p>
    <div id="sh-body" hidden>
      <div class="shfile"><img id="sh-img" alt=""><div><b id="sh-name"></b><br><span class="mu" id="sh-meta"></span></div></div>
      <span class="sglab" id="fmt-l" data-i18n="sh.format"></span>
      <div class="seg" id="fmt" role="group" aria-labelledby="fmt-l"><button type="button" data-fmt="pdf">PDF</button><button type="button" data-fmt="jpg">JPEG</button></div>
      <button type="button" class="b p wide" data-tile="all" id="shgo" style="margin-top:1.4rem" data-i18n="sh.go"></button>
      <p class="mu small" style="margin:.2rem 0 1rem" data-i18n="sh.hint"></p>
      <div class="row2"><button type="button" class="b" data-tile="save" data-i18n="tile.save"></button><button type="button" class="b" data-tile="print" data-i18n="tile.print"></button></div>
      <div id="shmsg" role="status" class="mu small"></div>
    </div>
  </main>

  <main id="v-reglages" hidden>
    <h1 data-i18n="set.title"></h1>
    <ul class="list">
      <li><button class="rb" type="button" data-go="historique"><span data-i18n="set.history"></span><span class="chev" aria-hidden="true">›</span></button></li>
      <li class="it"><span data-i18n="set.dark"></span><label class="sw" style="margin:0"><input type="checkbox" id="dark" role="switch" data-i18n-al="set.dark"><span class="trk"></span></label></li>
      <li class="it col"><span id="lang-l" data-i18n="set.lang"></span>
        <div class="seg" id="lang" role="group" aria-labelledby="lang-l"><button type="button" data-lang="en">English</button><button type="button" data-lang="pt">Português</button><button type="button" data-lang="fr">Français</button><button type="button" data-lang="de">Deutsch</button><button type="button" data-lang="es">Español</button><button type="button" data-lang="it">Italiano</button></div>
        <span class="mu small" data-i18n="set.langnote"></span></li>
    </ul>
  </main>

  <main id="v-historique" hidden>
    <button class="sm back" type="button" data-go="reglages">‹ <span data-i18n="set.title"></span></button>
    <h1 data-i18n="set.history"></h1>
    <p class="mu" id="hnone" data-i18n="his.empty"></p>
    <ul class="list" id="hlist"></ul>
  </main>
</div>
<div class="bar" id="bar" hidden>
  <div id="msg" role="status"></div>

const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};

const parseDur=(s,u)=>{s=String(s||'').trim().toLowerCase().replace(',','.');if(!s)return null;let m=s.match(/^(\d+)\s*(?:h|:)\s*(\d{0,2})$/);if(m)return +m[1]*60+(+m[2]||0);m=s.match(/^(\d+(?:\.\d+)?)\s*(min|m)?$/);if(!m)return null;const x=parseFloat(m[1]);return Math.round(m[2]||u==='min'?x:x*60)};

const fmt=m=>Math.floor(m/60)+'h'+String(m%60).padStart(2,'0');
const parseAmt=s=>{s=String(s||'').replace(/€/g,'').replace(/\s/g,'').replace(',','.');return /^\d+(\.\d+)?$/.test(s)?parseFloat(s):null};

  if(r.s&&r.e&&!r.w){let d=tm(r.e)-tm(r.s);if(d<0)d+=1440;let p=0;if(r.ps&&r.pe){p=tm(r.pe)-tm(r.ps);if(p<0)p+=1440}r.w=fmt(Math.max(d-p,0))}
  if(r.fr&&!r.dp&&!r.rp)r.dp=r.fr;

function makePdf(jpg,w,h){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length};
  push('%PDF-1.4\n');
  const obj=(n,body)=>{off[n]=len;push(n+' 0 obj\n'+body+'\nendobj\n')};
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 841.89 595.28] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  off[4]=len;push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');push(jpg);push('\nendstream\nendobj\n');
  const cs='q 841.89 0 0 595.28 0 0 cm /Im0 Do Q';
  obj(5,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  const xr=len;let x='xref\n0 6\n0000000000 65535 f \n';
  for(let i=1;i<=5;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}

}
const sPt=e=>{const r=sg.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
sg.addEventListener('pointerdown',e=>{e.preventDefault();sg.setPointerCapture(e.pointerId);sDown=true;const[x,y]=sPt(e);sx.beginPath();sx.moveTo(x,y);sx.lineTo(x+.01,y+.01);sx.stroke();sInk=true;$('#sigok').disabled=false});
sg.addEventListener('pointermove',e=>{if(!sDown)return;e.preventDefault();const[x,y]=sPt(e);sx.lineTo(x,y);sx.stroke();sx.beginPath();sx.moveTo(x,y)});
['pointerup','pointercancel'].forEach(n=>sg.addEventListener(n,()=>{sDown=false}));
function sigCrop(){
  const w=sg.width,h=sg.height,d=sx.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<x0)return'';const p=6;x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(w-1,x1+p);y1=Math.min(h-1,y1+p);
  const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(sg,x0,y0,o.width,o.height,0,0,o.width,o.height);return o.toDataURL('image/png')
}
$('#sigclr').addEventListener('click',sigReset);
$('#sigok').addEventListener('click',()=>{const u=sigCrop();if(!u)return;S.sig=u;S.sigmode='draw';$('#sigv').hidden=true;save();exportFile()});
$('#sigskip').addEventListener('click',()=>{S.sigmode='name';$('#sigv').hidden=true;save();exportFile()});
addEventListener('keydown',e=>{if(e.key==='Escape')$('#sigv').hidden=true});
const APPN={wa:'WhatsApp',gm:'Gmail',ol:'Outlook',ml:'E-mail',tg:'Telegram',sms:'SMS'};
const cur=()=>LAST&&LAST.files[FMT];
const subj=()=>'Feuille d’heures semaine '+LAST.week;
const defMsg=()=>'Bonjour,\n\nVoici ma feuille d’heures de la semaine '+LAST.week+' ('+fr(LAST.start)+' – '+fr(addDays(LAST.start,6))+').\n\nCordialement'+(LAST.who?'\n'+LAST.who:'');
async function exportFile(o){
  o=o||{};
  try{
    say('');
    if(!o.noHist&&sumMins()===0){say(t('exp.empty'));return}
    await loadSig(S.sigmode==='draw'?S.sig:'');
    const tot=draw();
    const jpg=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.93));
    const base='feuille-heures-'+S.start;
    const pdf=makePdf(new Uint8Array(await jpg.arrayBuffer()),1754,1240);
    if(LAST&&LAST.prev)URL.revokeObjectURL(LAST.prev);
    LAST={files:{pdf:new File([pdf],base+'.pdf',{type:'application/pdf'}),jpg:new File([jpg],base+'.jpg',{type:'image/jpeg'})},prev:URL.createObjectURL(jpg),week:isoWeek(S.start),start:S.start,tot,who:S.name,agency:S.agency};
    DONE=new Set();
    if(!o.noHist){const snap=JSON.parse(JSON.stringify(S));delete snap.wk;H.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),at:Date.now(),tot,snap});saveH()}
    shmsg('');renderShare();renderHistory();go('partage');
  }catch(e){say(t('fail'))}
}
async function reexport(id){
  const x=H.find(h=>h.id===id);if(!x)return;
  const keep={};Object.keys(S).forEach(k=>keep[k]=S[k]);
  Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,JSON.parse(JSON.stringify(x.snap)));S.wk=keep.wk;S.rows=S.rows.map(norm);
  await exportFile({noHist:true});
  Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,keep);update();
}
function renderShare(){
  const has=!!LAST;$('#t-partage').hidden=!has;$('#sh-empty').hidden=has;$('#sh-body').hidden=!has;if(!has)return;
  const f=cur();$('#sh-img').src=LAST.prev;$('#sh-name').textContent=f.name;
  $('#sh-meta').textContent=FMT.toUpperCase()+' · '+t('his.week',{w:LAST.week})+' · '+fmtS(LAST.tot)+' · '+Math.max(1,Math.round(f.size/1024))+' KB';
  document.querySelectorAll('#fmt button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.fmt===FMT)));
}
const toB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
async function saveFile(){
  const f=cur();
  if(window.AndroidBridge){const b64=await toB64(f);window.AndroidBridge.save(b64,f.name,f.type);return}
  let dl=null;try{if(host&&host.use)dl=await host.use('downloads')}catch(e){}
  if(dl){await dl.save({filename:f.name,data:new Blob([await f.arrayBuffer()],{type:f.type})})}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
}
function printSheet(){
  const im=$('#print-img'),done=()=>document.body.classList.remove('printing');
  im.src=LAST.prev;document.body.classList.add('printing');addEventListener('afterprint',done,{once:true});
  setTimeout(()=>{try{if(window.AndroidBridge)window.AndroidBridge.print();else window.print()}catch(e){done()}},60);setTimeout(done,60000);
}
async function tileAct(id){
  if(!LAST)return;
  const to='',body=defMsg(),sj=subj();
  try{
    if(id==='all'){
      let ok=false;
      if(window.AndroidBridge){window.AndroidBridge.share(await toB64(cur()),cur().name,cur().type,body);shmsg(t('sh.shared'));DONE.add(id);return}
      if(navigator.canShare&&navigator.canShare({files:[cur()]})){try{await navigator.share({files:[cur()],title:cur().name,text:body});ok=true;shmsg(t('sh.shared'))}catch(e){if(e&&e.name==='AbortError')throw e}}
      if(!ok){await saveFile();shmsg(t('sh.fallback'))}
    }else if(id==='save'){await saveFile();shmsg(t('sh.saved',{f:cur().name}))}
    else if(id==='print'){printSheet()}
    else{
      let u='';
      if(id==='wa')u='https://wa.me/?text='+enc(sj+'\n\n'+body);
      else if(id==='gm')u='https://mail.google.com/mail/?view=cm&fs=1&to='+enc(to)+'&su='+enc(sj)+'&body='+enc(body);
      else if(id==='ol')u='https://outlook.live.com/mail/0/deeplink/compose?to='+enc(to)+'&subject='+enc(sj)+'&body='+enc(body);
      else if(id==='ml')u='mailto:'+enc(to)+'?subject='+enc(sj)+'&body='+enc(body);
      else if(id==='tg')u='https://t.me/share/url?url=%20&text='+enc(sj+'\n\n'+body);
      else if(id==='sms')u='sms:?&body='+enc(body);
      let w=null;
      if(id==='ml'||id==='sms'){try{(window.top||window).location.href=u}catch(e){location.href=u}}
      else{try{w=window.open(u,'_blank','noopener')}catch(e){}
        if(!w){const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove()}}
      shmsg(t('sh.opened',{app:APPN[id]}));
    }
  }catch(e){
    if(e&&e.name==='AbortError'){shmsg(t('sh.cancel'));return}
    shmsg(e&&e.code==='declined'?t('sh.declined'):t('fail')+' ('+((e&&(e.code||e.name))||'?')+')');
  }
}
$('#fmt').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;FMT=b.dataset.fmt;try{localStorage.setItem('fh-fmt',FMT)}catch(x){}renderShare()});
$('#exp').addEventListener('click',()=>{say('');if(sumMins()===0){say(t('exp.empty'));return}openSig()});

/* ---------- clics globaux ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-open],[data-save],[data-go],[data-hopen],[data-hdel],[data-hshare],[data-tile],[data-wk]');if(!el)return;
  const d=el.dataset;
  if(d.go)return go(d.go);
  if(d.save)return toggleSave(d.save);
  if(d.open){S.agency=d.open;save();setST(S.name?'semaine':'infos');update();return go('feuille')}
  if(d.hopen){const x=H.find(h=>h.id===d.hopen);if(!x)return;loadSnap(x.snap);fillInputs();setST('semaine');update();return go('feuille')}
  if(d.hshare)return reexport(d.hshare);
  if(d.hdel){H=H.filter(h=>h.id!==d.hdel);saveH();renderHistory();return}
  if(d.tile)return tileAct(d.tile);
  if(d.wk)return setWeek(addDays(S.start,7*Number(d.wk)));
});

/* ---------- thème et langue ---------- */
const root=document.documentElement;
try{const th=localStorage.getItem('fh-theme');if(th)root.dataset.theme=th}catch(e){}
const theme=()=>root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
const syncTheme=()=>{$('#dark').checked=theme()==='dark';const m=document.querySelector('meta[name=theme-color]');if(m)m.content=theme()==='dark'?'#000000':'#ffffff'};
$('#dark').addEventListener('change',e=>{const v=e.target.checked?'dark':'light';root.dataset.theme=v;try{localStorage.setItem('fh-theme',v)}catch(x){}syncTheme()});
function applyLang(){
  root.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n)});
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>{e.placeholder=t(e.dataset.i18nPh)});
  document.querySelectorAll('[data-i18n-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.i18nAl))});
  renderHome();renderHistory();renderShare();update();
}
const syncLang=()=>document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)));
$('#lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;LANG=b.dataset.lang;try{localStorage.setItem('fh-lang',LANG)}catch(x){}syncLang();applyLang()});

/* ---------- navigation ---------- */
const V=['accueil','feuille','partage','reglages','historique'];
const TAB={accueil:'accueil',feuille:'accueil',partage:'partage',reglages:'reglages',historique:'reglages'};
function show(v){
  V.forEach(x=>{$('#v-'+x).hidden=x!==v});
  ['accueil','reglages','partage'].forEach(x=>{const b=$('#t-'+x);if(x===TAB[v])b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  $('#bar').hidden=v!=='feuille';document.body.classList.toggle('s',v==='feuille');
  if(v==='feuille'){const a=agOf(S.agency);$('#agimg').src=url(a);$('#agnm').textContent=a.name;if(ST==='apercu')draw()}
  if(v==='historique')renderHistory();
  window.scrollTo(0,0);
  const h=document.querySelector('#v-'+v+' h1')||(v==='feuille'?$('#agnm'):null);if(h){h.tabIndex=-1;h.focus({preventScroll:true})}
}
function route(){let h=location.hash.slice(1);if(!V.includes(h))h='accueil';if(h==='feuille'&&!agOf(S.agency))h='accueil';show(h)}
function go(v){if(location.hash==='#'+v)route();else location.hash=v}
addEventListener('hashchange',route);

/* ---------- démarrage ---------- */
syncLang();fillInputs();syncTheme();setST(S.name?'semaine':'infos');applyLang();route();
if(document.documentElement.classList.contains('splash'))setTimeout(()=>document.documentElement.classList.remove('splash'),2000);
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
